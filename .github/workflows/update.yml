name: daily-update
on:
  schedule:
    - cron: "0 23 * * *"   # 每天 07:00 新加坡时间
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python pipeline/run.py
      - name: commit data
        run: |
          git config user.name "world-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/latest.json
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
